name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { vm: debian12, file: debian_asan_12 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: scripts/${{ matrix.file }}.Dockerfile
          tags: ${{ matrix.vm }}
          outputs: type=docker,dest=/tmp/${{ matrix.vm }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.vm }}
          path: /tmp/${{ matrix.vm }}.tar
          compression-level: 0

  run:
    runs-on: ubuntu-latest
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vm: debian12, proj: test_bash }
          - { vm: debian12, proj: test_cello }
          - { vm: debian12, proj: test_curl }
          - { vm: debian12, proj: test_doom }
          - { vm: debian12, proj: test_git }
          - { vm: debian12, proj: test_gmake }
          - { vm: debian12, proj: test_gzip }
          - { vm: debian12, proj: test_imagemagick }
          - { vm: debian12, proj: test_jq }
          - { vm: debian12, proj: test_libpng }
          - { vm: debian12, proj: test_libuev }
          - { vm: debian12, proj: test_lua }
          - { vm: debian12, proj: test_openssl }
          - { vm: debian12, proj: test_perl }
          - { vm: debian12, proj: test_php }
          - { vm: debian12, proj: test_postgres }
          - { vm: debian12, proj: test_python }
          - { vm: debian12, proj: test_qbe_hare }
          - { vm: debian12, proj: test_sqlite }
          - { vm: debian12, proj: test_tinycc }
          - { vm: debian12, proj: test_toxcore }
          - { vm: debian12, proj: test_toybox }
          - { vm: debian12, proj: test_vim }
          - { vm: debian12, proj: test_zlib }
          - { vm: debian12, proj: test_zsh }
          - { vm: debian12, proj: build_gcc }
          - { vm: debian12, proj: build_nano }
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.vm }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/${{ matrix.vm }}.tar

      - name: Run test
        run: >
          sudo docker run ${{ matrix.vm }}
          su non-root -c
          'bash "$0" "$1"' /work/widcc/scripts/linux_thirdparty.bash ${{ matrix.proj }}
